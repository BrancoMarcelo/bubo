name: release
# Push a version tag → GitHub builds the DMG and publishes it as a release.
#   git tag v2.0 && git push origin v2.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write        # gh release create needs to write to the repo

jobs:
  build:
    runs-on: macos-14    # Apple Silicon runner
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}   # read in the cask-bump step's `if`
    steps:
      - uses: actions/checkout@v4

      # skip --selftest: a CI VM has no real battery/fan/power sensors to assert
      # on (and the x86_64 slice can't run on the Apple Silicon runner anyway)
      - name: Build DMGs
        run: BUBO_NO_SELFTEST=1 sh pack.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            Bubo-apple-silicon.dmg Bubo-intel.dmg \
            --title "Bubo $GITHUB_REF_NAME" \
            --notes "Drag **Bubo** to Applications.

          Pick your Mac: **Bubo-apple-silicon.dmg** (M1/M2/M3…) or **Bubo-intel.dmg**.
          \`brew install fajarhide/tap/bubo\` picks the right one automatically.

          First launch: right-click Bubo.app → **Open** → **Open** (ad-hoc signed, not notarized).
          Then right-click the menu-bar item → **Open at Login** so it's always there."

      # Point the Homebrew cask at the new version + both DMG hashes, so
      # `brew upgrade` picks it up and installs the slice matching the user's Mac.
      # Needs a token with contents:write on fajarhide/homebrew-tap, stored as the
      # TAP_TOKEN secret. Missing secret → step is skipped and the release still
      # ships; bump the cask by hand that once.
      - name: Bump Homebrew cask
        if: ${{ env.TAP_TOKEN != '' }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"                      # v1.1 -> 1.1
          ARM_SHA=$(shasum -a 256 Bubo-apple-silicon.dmg | awk '{print $1}')
          INTEL_SHA=$(shasum -a 256 Bubo-intel.dmg | awk '{print $1}')
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/fajarhide/homebrew-tap.git" tap
          # Regenerate the whole cask so the arch split stays in sync: on_arm and
          # on_intel each carry their own url + sha256, chosen at install time.
          # #{version}/#{appdir} are Ruby interpolations — kept literal by the shell.
          cat > tap/Casks/bubo.rb <<CASK
          cask "bubo" do
            version "${VERSION}"

            on_arm do
              sha256 "${ARM_SHA}"
              url "https://github.com/fajarhide/bubo/releases/download/v#{version}/Bubo-apple-silicon.dmg"
            end
            on_intel do
              sha256 "${INTEL_SHA}"
              url "https://github.com/fajarhide/bubo/releases/download/v#{version}/Bubo-intel.dmg"
            end

            name "Bubo"
            desc "Menu-bar monitor that flags the app hogging your CPU and RAM"
            homepage "https://github.com/fajarhide/bubo"

            depends_on macos: :ventura

            app "Bubo.app"

            # Ad-hoc signed, not notarized. Homebrew quarantines every cask and
            # (since 6.0) dropped --no-quarantine, so clear the flag ourselves or
            # the first launch is blocked by Gatekeeper.
            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-dr", "com.apple.quarantine", "#{appdir}/Bubo.app"]
            end

            zap trash: "~/Library/Preferences/local.bubo.plist"
          end
          CASK
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "cask already current, nothing to bump"
          else
            git commit -am "bubo ${VERSION}"
            git push
          fi
